<!doctype html>

<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>草叢大亂鬥</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="home">
      <div class="htop">
        <div class="hrow">
          <span class="pill" id="hMoney">💰 0</span
          ><span class="pill" id="hEnergy">⚡ 0</span
          ><span class="pill" id="hTokens">⭐ 0</span>
        </div>
        <h1 id="logo">草叢大亂鬥</h1>
        <div id="tag">⚽ 足球賽 · 7 對 7</div>
        <div id="hDaily"></div>
        <div class="hacct">
          <button id="hAcct" class="ch">👤 建立帳號</button
          ><span id="envTag"></span>
        </div>
      </div>
      <div class="hbot">
        <div class="hname">
          <button class="arrow" id="hPrev" aria-label="上一個角色">‹</button>
          <div id="hName"></div>
          <button class="arrow" id="hNext" aria-label="下一個角色">›</button>
        </div>
        <div class="hbtns">
          <button class="sbtn" id="hShop">🛒<small>商店</small></button
          ><button id="play">出擊!</button
          ><button class="sbtn" id="hChars">👤<small>角色</small></button>
        </div>
      </div>
    </div>
    <div id="shopscr" style="display: none">
      <div class="rtop">
        <button id="sBack" class="ch">⬅ 返回</button>
        <h2>商店</h2>
        <span class="pill" id="sMoney">💰 $0</span>
      </div>
      <div id="sgrid"></div>
    </div>
    <div id="sdetail" style="display: none">
      <div class="dtop">
        <button id="sdBack" class="ch">⬅ 返回</button>
        <div id="sdTitle"></div>
        <span class="pill" id="sdMoney">💰 $0</span>
      </div>
      <div id="sdIcon" class="bigicon"></div>
      <div id="sdDesc"></div>
      <div id="sdLv" class="lv"></div>
      <div id="sdCmp" class="cmp"></div>
      <div id="sdPv"></div>
      <div class="dbtns">
        <button class="arrow" id="sdPrev" aria-label="上一個商品">‹</button
        ><button id="sdBuy" class="buy"></button
        ><button class="arrow" id="sdNext" aria-label="下一個商品">›</button>
      </div>
    </div>
    <div id="roster" style="display: none">
      <div class="rtop">
        <button id="rBack" class="ch">⬅ 返回</button>
        <h2>角色</h2>
        <span class="pill" id="rMoney">💰 $0</span>
      </div>
      <div id="rgrid"></div>
    </div>
    <div id="detail" style="display: none">
      <div class="dtop">
        <button id="dBack" class="ch">⬅ 返回</button>
        <div id="dTitle"></div>
      </div>
      <canvas id="dcv" width="300" height="230"></canvas>
      <div id="dtags"></div>
      <div id="dprog"></div>
      <div id="dstats"></div>
      <div id="dmoves"></div>
      <div class="dbtns">
        <button class="arrow" id="dPrev" aria-label="上一個角色">‹</button
        ><button id="dPick" class="sbtn2">選擇出戰</button
        ><button id="dPlay" class="play2">出擊!</button
        ><button class="arrow" id="dNext" aria-label="下一個角色">›</button>
      </div>
    </div>
    <!-- 建立帳號 -->
    <div id="acct" style="display: none">
      <div class="rtop">
        <button id="aBack" class="ch">⬅ 返回</button>
        <h2>建立帳號</h2>
        <span></span>
      </div>
      <form id="aForm" novalidate>
        <label
          >Email
          <input id="aEmail" type="email" autocomplete="email" required
        /></label>
        <small class="ahint">小朋友請使用家長的 Email,驗證信會寄到這個信箱。</small>
        <label
          >密碼(至少 8 個字元)
          <input id="aPw" type="password" autocomplete="new-password" minlength="8" required
        /></label>
        <label
          >再輸入一次密碼
          <input id="aPw2" type="password" autocomplete="new-password" required
        /></label>
        <label
          >使用者名稱(選填,2~16 個字)
          <input id="aName" type="text" maxlength="16" autocomplete="nickname"
        /></label>
        <button id="aSubmit" type="submit">建立帳號</button>
        <div id="aMsg" role="status" aria-live="polite"></div>
      </form>
      <div id="aDone" style="display: none">
        <h3>✅ 帳號建立成功</h3>
        <div id="aDoneBody"></div>
        <button id="aDoneHome">返回首頁</button>
        <button id="aForget" class="ch">在這台裝置忘記這個帳號</button>
      </div>
    </div>
    <!-- 比賽結果:顯示比分與勝場獎勵,接著一定要做數學挑戰 -->
    <div id="ui" style="display: none">
      <h1 id="rTitle"></h1>
      <div id="msg"></div>
      <button id="go">📝 開始數學挑戰</button>
    </div>
    <!-- 2 分鐘數學挑戰 -->
    <div id="math" style="display: none">
      <div class="mtop">
        <div class="mtime"><i id="mBar"></i><b id="mTime">2:00</b></div>
        <div class="mstat">
          <span class="pill" id="mRight">✅ 0</span
          ><span class="pill" id="mCoins">💰 0</span
          ><span class="pill" id="mStreak">🔥 0</span>
        </div>
        <div id="mDbl">🃏 雙倍卡生效中:每題金幣 ×2</div>
      </div>
      <div id="mIntro">
        <h2>📝 2 分鐘數學挑戰</h2>
        <ul>
          <li>每答對 1 題得 <b>15~20 金幣</b>(難題 20)</li>
          <li>連續答對 5 題觸發 <b>⚡能量暴擊</b></li>
          <li>這次答對 <b>12 題以上</b>得到 <b>⭐星光代幣</b></li>
          <li>答錯沒關係,會告訴你正確答案</li>
        </ul>
        <button id="mStart">準備好了,開始!</button>
      </div>
      <div id="mPlay">
        <div id="mTag"></div>
        <div id="mQ"></div>
        <div id="mAns"></div>
        <div id="mFx"></div>
        <div id="mPad"></div>
      </div>
    </div>
    <!-- 數學挑戰結算 -->
    <div id="mres" style="display: none">
      <h2>⏰ 時間到!</h2>
      <div id="mrBig"></div>
      <div id="mrList"></div>
      <div id="mrCrit"></div>
      <div id="mrWrong"></div>
      <button id="mrOk">領取獎勵</button>
    </div>
    <script src="js/config.js"></script>
    <script src="js/lootlocker.js"></script>
    <script src="js/setup.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/state.js"></script>
    <script src="js/input.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/update.js"></script>
    <script src="js/render.js"></script>
    <script src="js/home.js"></script>
    <script src="js/roster.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/math.js"></script>
    <script src="js/rewards.js"></script>
    <script src="js/account.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
